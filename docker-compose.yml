services:
  mcp:
    build: .
    stdin_open: true
    env_file: .env
    ports:
      - "8902:8902"
    volumes:
      - ./var:/app/var

  auth:
    build: .
    command: python -m telegram_mcp.auth
    ports:
      - "8901:8901"
    env_file: .env
    volumes:
      - ./var:/app/var
    profiles:
      - auth
