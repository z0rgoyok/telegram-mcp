services:
  mcp:
    build: .
    stdin_open: true
    env_file: .env
    ports:
      - "8902:8902"
    volumes:
      - ./var:/app/var

  mcp-sse:
    build: .
    command:
      - python
      - -m
      - telegram_mcp
      - --transport
      - sse
      - --http-host
      - 0.0.0.0
      - --http-port
      - "8000"
    env_file: .env
    environment:
      MEDIA_PROXY_PORT: 8904
      MEDIA_PROXY_PUBLIC_BASE_URL: http://localhost:8904
    ports:
      - "8903:8000"
      - "8904:8904"
    volumes:
      - ./var:/app/var
    profiles:
      - sse

  auth:
    build: .
    command: python -m telegram_mcp.auth
    ports:
      - "8901:8901"
    env_file: .env
    volumes:
      - ./var:/app/var
    profiles:
      - auth
